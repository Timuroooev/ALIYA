<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Team</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Our Team</h1>
        <p>Web Development Project</p>
    </header>

    <main>

        <!-- ОСНОВНЫЕ ВКЛАДКИ -->
        <div class="tabs">

            <button onclick="openTab('aliya')">
                Алия
            </button>

            <button onclick="openTab('timur')">
                Тимур
            </button>

            <button onclick="openTab('ayazhan')">
                Аяжан
            </button>

            <button onclick="openTab('task5')">
                Task 5
            </button>

        </div>


        <!-- АЛИЯ -->
        <section id="aliya" class="tab-content active">

            <h2>Алия</h2>

            <p>Участник команды</p>

        </section>


        <!-- ТИМУР -->
        <section id="timur" class="tab-content">

            <h2>Тимур</h2>

            <p>Участник команды</p>

        </section>


        <!-- АЯЖАН -->
        <section id="ayazhan" class="tab-content">

            <h2>Аяжан</h2>

            <p>Участник команды</p>

        </section>


        <!-- TASK 5 -->
        <section id="task5" class="tab-content products-section">

            <h2>Task 5 — Products</h2>

            <p>Product management using DummyJSON API</p>


            <!-- ПОИСК -->
            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Введите название товара..."
                >

                <button onclick="searchProducts()">
                    Search
                </button>

                <button onclick="loadProducts()">
                    Show all
                </button>

            </div>


            <!-- ДОБАВЛЕНИЕ ТОВАРА -->
            <div class="add-product">

                <h3>Add new product</h3>

                <input
                    type="text"
                    id="productTitle"
                    placeholder="Название товара"
                >

                <input
                    type="number"
                    id="productPrice"
                    placeholder="Цена"
                >

                <input
                    type="text"
                    id="productCategory"
                    placeholder="Категория"
                >

                <input
                    type="text"
                    id="productImage"
                    placeholder="Ссылка на картинку"
                >

                <textarea
                    id="productDescription"
                    placeholder="Описание товара"
                ></textarea>

                <input
                    type="number"
                    id="productRating"
                    placeholder="Рейтинг"
                    min="0"
                    max="5"
                    step="0.1"
                >

                <button onclick="addProduct()">
                    Add product
                </button>

            </div>


            <!-- ТОВАРЫ -->
            <div id="productsContainer" class="products-container">

                <p>Loading products...</p>

            </div>

        </section>

    </main>


    <footer>

        <p>© 2026 Our Team</p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
